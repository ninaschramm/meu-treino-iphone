<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152c2b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Meu Treino</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17312f;background:#f5f7f4}*{box-sizing:border-box}body{margin:0}header{background:#173c38;color:white;padding:calc(env(safe-area-inset-top) + 22px) 20px 20px}header h1{font-size:24px;margin:0 0 4px}header p{margin:0;color:#d3e4df;font-size:13px}main{max-width:640px;margin:auto;padding:18px 16px 110px}.card{background:white;border:1px solid #e0e8e3;border-radius:18px;padding:17px;margin-bottom:13px;box-shadow:0 3px 14px #123a3210}.muted{color:#60746e;font-size:13px}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#66837a;font-weight:700}h2{font-size:23px;margin:7px 0}h3{font-size:16px;margin:0 0 6px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{background:#e4f1e9;color:#1e614b;padding:7px 10px;border-radius:30px;font-size:12px;font-weight:650}button{font:inherit;border:0;border-radius:12px;padding:12px 15px;background:#1d6656;color:white;font-weight:650;cursor:pointer}button.secondary{background:#eaf0ec;color:#235448}button.ghost{background:transparent;color:#1d6656;padding:7px 4px}button.danger{background:#fbe7e6;color:#9a3831}button:disabled{opacity:.4}input,select{font:inherit;border:1px solid #d2ddd6;border-radius:10px;padding:10px;background:#fff;color:#17312f;min-width:0}input[type=number]{width:100%;text-align:center}.series{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;align-items:center;margin:9px 0}.series.head{font-size:12px;color:#687e76;text-align:center}.series label{text-align:center;font-size:13px}.exercise{padding:15px 0;border-top:1px solid #edf0ed}.exercise:first-child{border-top:0;padding-top:0}.exercise p{margin:0 0 10px}.note{background:#f3f7f3;border-radius:10px;padding:9px;font-size:12px;color:#60746e}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;backdrop-filter:blur(12px);border-top:1px solid #e2e8e3;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);display:flex;justify-content:center;gap:8px}.bottom button{flex:1;max-width:210px}.hidden{display:none!important}.stack{display:grid;gap:9px}.wide{width:100%}.editrow{display:grid;grid-template-columns:1fr 76px 32px;gap:8px;align-items:center;margin-top:9px}.small{font-size:12px}.history-item{border-top:1px solid #edf0ed;padding:12px 0}.history-item:first-child{border:0}.badge{font-size:12px;color:#61766e}textarea{width:100%;min-height:60px;border:1px solid #d2ddd6;border-radius:10px;padding:10px;font:inherit}nav{display:flex;gap:7px;margin-bottom:16px}nav button{flex:1;background:#e8eeea;color:#42645a;font-size:13px;padding:11px 5px}nav button.active{background:#1d6656;color:white}.helper{font-size:12px;line-height:1.5;color:#647870}.spaced{margin-top:14px}.formlabel{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}details summary{cursor:pointer;color:#1d6656;font-size:13px;font-weight:600}input[type=file]{width:100%}
.video-link{display:inline-block;font-size:13px;color:#1d6656;font-weight:650;margin:0 0 10px;text-decoration:none}.video-link:focus,.video-link:hover{text-decoration:underline}.history-table{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0 15px}.history-table th,.history-table td{padding:9px 5px;border-bottom:1px solid #e6eee9;text-align:left;vertical-align:top}.history-table th{color:#60746e;font-size:11px}.history-table td:first-child{font-weight:650;max-width:125px;overflow-wrap:anywhere}.history-table td:not(:first-child){white-space:nowrap}.history-scroll{overflow-x:auto}</style></head><body><header><h1>Meu Treino 🌿</h1><p>Fortalecimento, no seu ritmo.</p></header><main><nav><button id="tab-train" onclick="showTab('train')">Treinar</button><button id="tab-history" onclick="showTab('history')">Histórico</button><button id="tab-edit" onclick="showTab('edit')">Editar</button></nav><section id="train"></section><section id="history" class="hidden"></section><section id="edit" class="hidden"></section></main><div class="bottom" id="bottom"></div><script>
const KEY='meu-treino-v1';const defaults={next:0,workouts:[{name:'A',title:'Pernas e joelhos',exercises:[['Bicicleta ergométrica (aquecimento)','5 min',0],['Leg press','10–12',2],['Cadeira extensora','10–12',2],['Mesa flexora','10–12',2],['Elevação pélvica','12',2],['Panturrilha','15',2],['Prancha','30 s',2]]},{name:'B',title:'Superiores e tronco',exercises:[['Aquecimento leve','4 min',0],['Puxada frontal','10–12',2],['Remada sentada','10–12',2],['Supino na máquina','10–12',2],['Desenvolvimento de ombros','10',2],['Face pull','12–15',2],['Dead bug','10 por lado',2]]},{name:'C',title:'Corpo inteiro',exercises:[['Bicicleta ergométrica (aquecimento)','5 min',0],['Agachamento no banco','10',2],['Terra romeno com halteres','10',2],['Remada unilateral','10 por lado',2],['Flexão inclinada ou supino máquina','10',2],['Caminhada do fazendeiro','30 s',2],['Abdução de quadril na máquina','12–15',2]]}].map(w=>({...w,exercises:w.exercises.map(e=>({id:crypto.randomUUID(),name:e[0],reps:e[1],sets:e[2]}))})),history:[],draft:null};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults);if(!state.workouts||!state.history)throw Error()}catch{state=structuredClone(defaults)}let tab='train';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(state))}function latest(id){for(const h of state.history.slice().reverse()){let x=h.exercises.find(x=>x.id===id);if(x)return x}return null}function draft(){let w=state.workouts[state.next];if(!state.draft||state.draft.workout!==w.name){state.draft={workout:w.name,exercises:w.exercises.map(e=>({id:e.id,sets:Array.from({length:e.sets},(_,i)=>{let old=latest(e.id)?.sets[i];return {weight:old?.weight??'',reps:old?.reps??''}})})),pain:'',note:''};save()}return state.draft}function showTab(t){tab=t;render()}function render(){for(let t of ['train','history','edit']){document.getElementById(t).classList.toggle('hidden',t!==tab);document.getElementById('tab-'+t).classList.toggle('active',t===tab)}document.getElementById('bottom').innerHTML=tab==='train'?'<button class="secondary" onclick="skip()">Trocar treino</button><button onclick="finish()">Concluir treino ✓</button>':'';if(tab==='train')renderTrain();if(tab==='history')renderHistory();if(tab==='edit')renderEdit()}
const VIDEO_MAP={'Leg press':'https://www.youtube.com/watch?v=waAxlYvtCcI','Cadeira extensora':'https://www.youtube.com/watch?v=aEcEA0_WZC8','Mesa flexora':'https://www.youtube.com/watch?v=aEcEA0_WZC8'};
function videoUrl(name){return VIDEO_MAP[name]||'https://www.youtube.com/results?search_query='+encodeURIComponent(name+' execução correta exercício');}
function timed(e){return /(?:prancha|dead bug|caminhada do fazendeiro)/i.test(e.name||'')&&/(?:\d+\s*s\b|segundo)/i.test(e.reps||'');}
function formatSet(s,e){let v=esc(s.reps||'—');return timed(e)?v+( /^\d+$/.test(String(s.reps||''))?' s':''):(s.weight!==''&&s.weight!=null?esc(s.weight)+' kg × ':'')+v;}
function renderTrain(){let w=state.workouts[state.next],d=draft();document.getElementById('train').innerHTML=`<div class="card"><div class="row"><span class="eyebrow">Próximo treino</span><span class="pill">ABC rotativo</span></div><h2>${w.name} · ${esc(w.title)}</h2><p class="muted">${w.exercises.filter(e=>e.sets).length} exercícios · cerca de 30–35 min</p></div><div class="card">${w.exercises.map(e=>{let de=d.exercises.find(x=>x.id===e.id);let last=latest(e.id);return `<div class="exercise"><h3>${esc(e.name)}</h3><a class="video-link" href="${esc(videoUrl(e.name))}" target="_blank" rel="noopener noreferrer">▶ Ver execução no YouTube ↗</a><p class="muted">${e.sets?`${e.sets} séries · ${esc(e.reps)} repetições`:`${esc(e.reps)} · aquecimento`}</p>${e.sets?`<div class="series head"><span>Série</span><span>Peso (kg)</span><span>Reps / tempo</span></div>${de.sets.map((s,i)=>`<div class="series"><label>${i+1}</label><input aria-label="Peso série ${i+1} ${esc(e.name)}" inputmode="decimal" type="number" min="0" step="0.5" value="${esc(s.weight)}" oninput="updateSet('${e.id}',${i},'weight',this.value)"><input aria-label="Repetições série ${i+1} ${esc(e.name)}" type="text" value="${esc(s.reps)}" oninput="updateSet('${e.id}',${i},'reps',this.value)"></div>`).join('')}`:''}<div class="note">${last?`Última vez: ${last.sets.map(s=>formatSet(s,e)).join(' / ')}`:'Sem registro anterior'}</div></div>`}).join('')}</div><div class="card"><h3>Como ficaram os joelhos?</h3><label class="formlabel" for="pain">Dor ou desconforto (opcional)</label><select id="pain" onchange="updateDraft('pain',this.value)"><option value="">Não registrar</option>${Array.from({length:11},(_,i)=>`<option value="${i}" ${String(d.pain)===String(i)?'selected':''}>${i} / 10</option>`).join('')}</select><label class="formlabel" for="note">Observações (opcional)</label><textarea id="note" placeholder="Ex.: joelho direito incomodou no leg press" oninput="updateDraft('note',this.value)">${esc(d.note)}</textarea><p class="helper">Registros salvos automaticamente neste iPhone. Exercícios e cargas podem ser alterados na aba Editar.</p></div>`}
function updateSet(id,i,k,v){draft().exercises.find(x=>x.id===id).sets[i][k]=v;save()}function updateDraft(k,v){draft()[k]=v;save()}function finish(){let d=draft(),w=state.workouts[state.next];if(!confirm(`Concluir treino ${w.name} e avançar para o próximo?`))return;state.history.push({...structuredClone(d),date:new Date().toISOString(),title:w.title});state.next=(state.next+1)%3;state.draft=null;save();render();window.scrollTo(0,0)}function skip(){if(!confirm('Trocar para o próximo treino? O registro ainda não concluído será descartado.'))return;state.next=(state.next+1)%3;state.draft=null;save();render()}
function renderHistory(){document.getElementById('history').innerHTML=`<div class="card"><h2>Histórico</h2><p class="muted">${state.history.length} treino(s) concluído(s)</p>${state.history.length?state.history.slice().reverse().map(h=>{let w=state.workouts.find(w=>w.name===h.workout);return `<div class="history-item"><div class="row"><strong>${esc(h.workout)} · ${esc(h.title||w?.title||'')}</strong><span class="badge">${new Date(h.date).toLocaleDateString('pt-BR')}</span></div><details><summary>Ver séries</summary><div class="history-scroll"><table class="history-table"><thead><tr><th>Exercício</th><th>Série 1</th><th>Série 2</th></tr></thead><tbody>${h.exercises.map(e=>{let ex=w?.exercises.find(x=>x.id===e.id)||e;return `<tr><td>${esc(ex.name||'Exercício')}</td><td>${e.sets.length?formatSet(e.sets[0],ex):'Aquecimento'}</td><td>${e.sets[1]?formatSet(e.sets[1],ex):'—'}${e.sets.length>2?'<br>+'+(e.sets.length-2)+' série(s)':''}</td></tr>`}).join('')}</tbody></table></div>${h.pain!==''?`<p class="small">Joelhos: ${esc(h.pain)}/10</p>`:''}${h.note?`<p class="small">${esc(h.note)}</p>`:''}</details></div>`}).join(''):'<p class="muted">Seu primeiro treino aparecerá aqui.</p>'}</div>`}
function renderEdit(){document.getElementById('edit').innerHTML=`<div class="card"><h2>Personalizar treinos</h2><p class="muted">Altere nomes, séries e metas de repetições. Mudanças descartam o treino em andamento.</p>${state.workouts.map((w,wi)=>`<div class="exercise"><h3>Treino ${w.name}</h3><input aria-label="Nome treino ${w.name}" style="width:100%" value="${esc(w.title)}" onchange="editTitle(${wi},this.value)">${w.exercises.map((e,ei)=>`<div class="editrow"><input aria-label="Nome exercício" value="${esc(e.name)}" onchange="editEx(${wi},${ei},'name',this.value)"><input aria-label="Séries" type="number" min="0" max="5" value="${e.sets}" onchange="editEx(${wi},${ei},'sets',this.value)"><button class="ghost" aria-label="Excluir exercício" onclick="removeEx(${wi},${ei})">✕</button></div><input style="width:100%;margin-top:5px" aria-label="Meta repetições" placeholder="Repetições ou duração" value="${esc(e.reps)}" onchange="editEx(${wi},${ei},'reps',this.value)">`).join('')}<button class="secondary spaced" onclick="addEx(${wi})">+ Adicionar exercício</button></div>`).join('')}</div><div class="card"><h3>Seus dados</h3><p class="helper">O backup contém os treinos e o histórico completo. Guarde-o no app Arquivos ou iCloud Drive. O armazenamento local pode ser apagado pelo iOS ou ao limpar os dados do navegador.</p><div class="stack"><button onclick="exportData()">Exportar backup (.json)</button><label class="formlabel" for="import">Importar backup</label><input id="import" type="file" accept=".json,application/json" onchange="importData(this.files[0])"><button class="danger" onclick="resetAll()">Apagar todos os dados</button></div></div>`}
function invalidate(){state.draft=null;save()}function editTitle(w,v){state.workouts[w].title=v;invalidate()}function editEx(w,e,k,v){state.workouts[w].exercises[e][k]=k==='sets'?Math.max(0,Math.min(5,Number(v)||0)):v;invalidate()}function removeEx(w,e){if(confirm('Excluir este exercício? O histórico anterior será mantido.')){state.workouts[w].exercises.splice(e,1);invalidate();render()}}function addEx(w){state.workouts[w].exercises.push({id:crypto.randomUUID(),name:'Novo exercício',sets:2,reps:'10–12'});invalidate();render()}function exportData(){let blob=new Blob([JSON.stringify({app:'meu-treino',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='meu-treino-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}async function importData(file){if(!file)return;try{let x=JSON.parse(await file.text());if(x.app!=='meu-treino'||!Array.isArray(x.data?.workouts)||x.data.workouts.length!==3||!Array.isArray(x.data?.history))throw Error('Formato inválido');if(!confirm('Substituir todos os dados atuais pelo backup?'))return;state=x.data;save();render();alert('Backup importado!')}catch(e){alert('Não foi possível importar: '+e.message)}}function resetAll(){if(confirm('Apagar permanentemente treinos e histórico deste aparelho?')){state=structuredClone(defaults);save();render()}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
